name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly, because most findings arrive as new queries against unchanged code
    # rather than as new code.
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyse:
    # CodeQL has no PHP support, so this covers the admin page script and the workflows only.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
